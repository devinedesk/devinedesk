apiVersion: apps/v1
kind: Deployment
metadata:
  name: devinedesk-web
  labels:
    app: devinedesk
    tier: frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: devinedesk
      tier: frontend
  template:
    metadata:
      labels:
        app: devinedesk
        tier: frontend
    spec:
      containers:
        - name: devinedesk-web
          image: devinedesk/web:latest
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: devinedesk-secrets
          resources:
            requests:
              cpu: '250m'
              memory: '512Mi'
            limits:
              cpu: '1000m'
              memory: '1Gi'
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devinedesk-worker
  labels:
    app: devinedesk
    tier: background
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devinedesk
      tier: background
  template:
    metadata:
      labels:
        app: devinedesk
        tier: background
    spec:
      containers:
        - name: devinedesk-worker
          image: devinedesk/worker:latest
          envFrom:
            - secretRef:
                name: devinedesk-secrets
          resources:
            requests:
              cpu: '500m'
              memory: '1Gi'
            limits:
              cpu: '2000m'
              memory: '2Gi'
