# Single-VM deployment compose — full production stack.
#
# Topology: `proxy` (nginx) is the edge — it binds 80/443, terminates TLS with
# Let's Encrypt certs (renewed by the `certbot` service), and routes:
#   /api/*   -> backend:4000
#   /minio/* -> minio:9000
#   /*       -> frontend:80
# The frontend is internal HTTP-only (it mounts nginx.dev.conf over the image's
# direct-SSL nginx.conf) and must NOT bind host ports — the proxy owns 80/443.
#
# Usage:
#   docker compose -f docker-compose.deploy.yml --env-file .env.production up -d --build
#   # with face swap:
#   docker compose -f docker-compose.deploy.yml --env-file .env.production --profile facefusion up -d --build

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-devinedesk}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-devinedesk}?schema=public
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      REDIS_URL: redis://redis:6379
      AI_PROVIDER: ${AI_PROVIDER:-openrouter}
    ports:
      - "4000:4000"
    command: sh -c "cd /app/packages/db && bunx prisma migrate deploy && cd /app/apps/backend && bun src/index.ts"
    healthcheck:
      test: ["CMD-SHELL", "bun -e 'fetch(\"http://127.0.0.1:4000/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        # API origin baked into the bundle — must be BACKEND_URL
        # (https://api.devinedesk.com), NOT FRONTEND_URL (a CORS origin list).
        VITE_API_URL: ${BACKEND_URL}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        # Sentry auth token for source map upload (CI/CD only).
        # When set, the Vite plugin uploads source maps to Sentry.
        SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN:-}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    volumes:
      # HTTP-only server block; SSL is terminated by the proxy service.
      - ./apps/frontend/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    entrypoint: >
      sh -c "trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h;
      done"
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt

  facefusion:
    build:
      context: .
      dockerfile: infra/facefusion/Dockerfile
    restart: unless-stopped
    profiles: ["facefusion"]
    environment:
      FACE_SWAPPER_MODEL: ${FACE_SWAPPER_MODEL:-hyperswap_1a_256}
      FACE_SWAPPER_PIXEL_BOOST: ${FACE_SWAPPER_PIXEL_BOOST:-1024x1024}
      FACE_ENHANCER_ENABLED: ${FACE_ENHANCER_ENABLED:-true}
      FACE_ENHANCER_MODEL: ${FACE_ENHANCER_MODEL:-gfpgan_1.4}
      FACE_ENHANCER_BLEND: ${FACE_ENHANCER_BLEND:-30}
      FACE_MASK_BLUR: ${FACE_MASK_BLUR:-0.2}
    ports:
      - "7865:7865"
    volumes:
      - facefusion_data:/facefusion/.assets
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7865/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 600s

volumes:
  postgres_data:
  minio_data:
  redis_data:
  facefusion_data:
  certbot_www:
  certbot_certs:
