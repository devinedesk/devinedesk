name: Build and push images

# Builds the backend and frontend Docker images and pushes them to GitHub
# Container Registry (ghcr.io). The frontend bakes VITE_API_URL at build time,
# so production must build with the production API origin
# (https://api.devinedesk.com).
#
# No external secrets required — uses the automatically-provided GITHUB_TOKEN
# to authenticate to ghcr.io. The repository must have "Packages: write"
# permission for the GITHUB_TOKEN (set in Settings → Actions → General →
# Workflow permissions).
#
# Images produced (tagged with both `latest` and the commit SHA):
#   ghcr.io/devinedesk/devinedesk/backend
#   ghcr.io/devinedesk/devinedesk/frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # ghcr.io images are namespaced as <owner>/<repo>/<image>
  IMAGE_PREFIX: ${{ github.repository }}
  FRONTEND_API_URL: https://api.devinedesk.com

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            image: backend
            dockerfile: apps/backend/Dockerfile
          - name: frontend
            image: frontend
            dockerfile: apps/frontend/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image path
        id: image
        run: echo "path=$(echo ${{ env.IMAGE_PREFIX }}/${{ matrix.image }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          # Only the frontend consumes VITE_API_URL; the backend ignores it.
          # SENTRY_AUTH_TOKEN is used by the frontend build to upload source maps.
          build-args: |
            VITE_API_URL=${{ env.FRONTEND_API_URL }}
            VITE_SENTRY_DSN=${{ secrets.SENTRY_DSN_FRONTEND }}
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.path }}:latest
            ${{ env.REGISTRY }}/${{ steps.image.outputs.path }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # ─────────────────────────────────────────────────────────────────────────
  # Deploy: SSH into the production VM, pull latest code, rebuild & restart.
  # Only runs after both build-and-push jobs succeed.
  #
  # Required GitHub repository secrets (Settings → Secrets and variables → Actions):
  #   DEPLOY_SSH_HOST     — production VM IP or hostname (e.g. 1.2.3.4)
  #   DEPLOY_SSH_USER     — SSH user on the VM (e.g. root or deploy)
  #   DEPLOY_SSH_KEY      — private SSH key (contents of ~/.ssh/id_ed25519 or id_rsa)
  #   DEPLOY_SSH_PORT     — SSH port (optional, defaults to 22)
  #   DEPLOY_PATH         — absolute path to the repo on the VM (e.g. /opt/devinedesk)
  #
  # Until these secrets are set, the deploy job will be skipped (it checks
  # for DEPLOY_SSH_HOST and exits early if missing). The build-and-push job
  # above still runs regardless.
  # ─────────────────────────────────────────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Check deploy secrets are configured
        id: check
        env:
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
        run: |
          if [ -z "$SSH_HOST" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "::warning::DEPLOY_SSH_HOST secret is not set — skipping deploy. Set deploy secrets to enable automatic CD."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "Deploy secrets found — will deploy to $SSH_HOST"
          fi

      - name: Deploy to production VM
        if: steps.check.outputs.skip != 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            echo "=== DevineDesk auto-deploy: ${{ github.sha }} ==="
            cd ${{ secrets.DEPLOY_PATH }}
            echo "1/4: Pulling latest code from main..."
            git fetch origin main
            git reset --hard origin/main
            echo "2/4: Rebuilding Docker images..."
            sudo docker compose -f docker-compose.prod.yml build
            echo "3/4: Restarting services..."
            sudo docker compose -f docker-compose.prod.yml up -d postgres minio backend frontend proxy certbot
            echo "4/4: Waiting for backend health..."
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:4000/health > /dev/null 2>&1; then
                echo "Backend is healthy!"
                curl -s http://127.0.0.1:4000/health
                break
              fi
              echo "  Waiting... ($i/30)"
              sleep 5
            done
            echo "=== Deploy complete! ==="
            sudo docker compose -f docker-compose.prod.yml ps

      - name: Deploy skipped (no secrets)
        if: steps.check.outputs.skip == 'true'
        run: |
          echo "::notice::Automatic deploy was skipped because DEPLOY_SSH_HOST is not set."
          echo "To enable automatic CD, add these GitHub repository secrets:"
          echo "  DEPLOY_SSH_HOST  — VM IP or hostname"
          echo "  DEPLOY_SSH_USER  — SSH user (e.g. root)"
          echo "  DEPLOY_SSH_KEY   — private SSH key contents"
          echo "  DEPLOY_PATH      — repo path on VM (e.g. /opt/devinedesk)"
          echo "  DEPLOY_SSH_PORT  — (optional) SSH port, defaults to 22"
          echo ""
          echo "Set them with: gh secret set DEPLOY_SSH_HOST"
          echo "Or via: Settings → Secrets and variables → Actions → New repository secret"
