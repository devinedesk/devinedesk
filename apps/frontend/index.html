<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>DevineDesk — AI Video & Image Generation Studio</title>
    <meta name="title" content="DevineDesk — AI Video & Image Generation Studio" />
    <meta name="description" content="DevineDesk is an AI-powered generative media platform. Create cinematic AI videos, stunning images, face swaps, and personalized template renders in minutes. Start creating with 200+ AI models." />
    <meta name="keywords" content="AI video generator, AI image generator, face swap, AI media generation, cinematic AI video, text to video, text to image, DevineDesk, AI templates, generative AI" />
    <meta name="author" content="DevineDesk" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-video-preview:large" />
    <link rel="canonical" href="https://devinedesk.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://devinedesk.com/" />
    <meta property="og:title" content="DevineDesk — AI Video & Image Generation Studio" />
    <meta property="og:description" content="Create cinematic AI videos, stunning images, face swaps, and personalized template renders in minutes. Start creating with 200+ AI models." />
    <meta property="og:image" content="https://devinedesk.com/og-image.png" />
    <meta property="og:site_name" content="DevineDesk" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://devinedesk.com/" />
    <meta name="twitter:title" content="DevineDesk — AI Video & Image Generation Studio" />
    <meta name="twitter:description" content="Create cinematic AI videos, stunning images, face swaps, and personalized template renders in minutes. Start creating with 200+ AI models." />
    <meta name="twitter:image" content="https://devinedesk.com/og-image.png" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "DevineDesk",
      "applicationCategory": "MultimediaApplication",
      "operatingSystem": "Web",
      "description": "AI-powered generative media platform for creating cinematic AI videos, images, face swaps, and personalized template renders.",
      "url": "https://devinedesk.com",
      "offers": {
        "@type": "AggregateOffer",
        "priceCurrency": "INR",
        "lowPrice": "499",
        "highPrice": "4999",
        "offerCount": "3"
      },
      "featureList": [
        "AI video generation with 200+ models",
        "AI image generation",
        "Face swap with FaceFusion",
        "Reusable video templates",
        "Credit-based billing",
        "Google OAuth & email authentication"
      ]
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "DevineDesk",
      "url": "https://devinedesk.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://devinedesk.com/?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root">
      <noscript>
        <h1>DevineDesk — AI Video &amp; Image Generation Studio</h1>
        <p>DevineDesk is an AI-powered generative media platform. Create cinematic AI videos, stunning images, face swaps, and personalized template renders in minutes with 200+ AI models.</p>
        <ul>
          <li>AI Video Generation — Text-to-video with cinematic models like Seedance, Kling, and Flux</li>
          <li>AI Image Generation — High-resolution images with Flux and other top models</li>
          <li>Face Swap — AI-powered face swapping with FaceFusion</li>
          <li>Video Templates — Reusable cinematic templates with personalized avatars</li>
          <li>Credit-based billing — Starter, Pro, and Studio plans</li>
        </ul>
        <p><a href="/video">Start creating AI videos</a> | <a href="/image">Generate AI images</a> | <a href="/face-swap">Face swap</a> | <a href="/billing">View pricing</a></p>
      </noscript>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
