# Local dev nginx config (HTTP only, no SSL).
server {
    listen 80;
    server_name _;
    aio off;
    root /usr/share/nginx/html;
    index index.html;

    # ---- Security headers ----
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ---- Gzip compression ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # ---- API proxy: route /api/ to the backend container ----
    location /api/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 500M;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ---- MinIO public S3 access: route /minio/ to the MinIO container ----
    location /minio/ {
        proxy_pass http://minio:9000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Static asset caching (hashed filenames = immutable) ----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- Showcase videos (long cache, content-addressed) ----
    location /showcase/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ---- SPA fallback: serve index.html for client-side routes ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- Don't cache index.html (so new deploys are picked up immediately) ----
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
